<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://satisfactory-planner.net/" />

    <title>Satisfactory 生産計画ツール — 日本語ソルバー＆Excel出力</title>
    <meta
      name="description"
      content="Satisfactory の生産ラインを日本語で計算する非公式ツール。目標レートを入れるだけで必要なレシピ・建物数・電力・原料を最適化し、Excel（6シート）とフローチャートで出力します。代替レシピ・クロック・サマースループにも対応。インストール不要・ブラウザだけで動きます。"
    />
    <meta name="theme-color" content="#101318" />

    <!--
      OGP。og:image は絶対URLが要るクローラが多いので、公開ドメインが決まったら
      /ogp.png を https://<ドメイン>/ogp.png に書き換える（画像の原本は public/ogp.svg）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Satisfactory 生産計画ツール" />
    <meta property="og:title" content="Satisfactory 生産計画ツール — 日本語ソルバー＆Excel出力" />
    <meta
      property="og:description"
      content="目標レートを入れるだけで、必要なレシピ・建物数・電力・原料を最適化。Excel出力とフローチャート付きの非公式ファンツールです。"
    />
    <meta property="og:image" content="https://satisfactory-planner.net/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Satisfactory 生産計画ツール" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://satisfactory-planner.net/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Satisfactory 生産計画ツール — 日本語ソルバー＆Excel出力" />
    <meta
      name="twitter:description"
      content="目標レートを入れるだけで、必要なレシピ・建物数・電力・原料を最適化。Excel出力とフローチャート付きの非公式ファンツールです。"
    />
    <meta name="twitter:image" content="https://satisfactory-planner.net/ogp.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Satisfactory 生産計画ツール",
        "url": "https://satisfactory-planner.net/",
        "description": "Satisfactory の目標産出から必要なレシピ、建物、原料、電力、物流を日本語で計算する無料のWebアプリケーションです。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        },
        "inLanguage": "ja"
      }
    </script>

    <!--
      テスト用URL（Vercel のプレビュー等、*.vercel.app のホスト）だけ検索避けする。
      同じ内容のページが複数のURLで拾われると本番ドメインの評価が割れるため。
      本番ドメインでは何もしない（この <meta> 自体が入らない）。
    -->
    <script>
      if (location.hostname.endsWith('.vercel.app')) {
        var robots = document.createElement('meta')
        robots.name = 'robots'
        robots.content = 'noindex'
        document.head.appendChild(robots)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
