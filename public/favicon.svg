<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Satisfactory 生産計画ツール">
  <!--
    このツールのマーク。ゲームのアセットは使わない（権利上、いつでも差し替えられるように）。
    16px でも潰れないよう、歯は6枚・太めにして中央の穴を大きく取っている。
  -->
  <rect width="32" height="32" rx="7" fill="#101318"/>
  <g fill="#f0a13c">
    <g>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2"/>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(60 16 16)"/>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(120 16 16)"/>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(180 16 16)"/>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(240 16 16)"/>
      <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(300 16 16)"/>
    </g>
    <circle cx="16" cy="16" r="10"/>
  </g>
  <circle cx="16" cy="16" r="4.2" fill="#101318"/>
</svg>
