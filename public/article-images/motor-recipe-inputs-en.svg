<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Motor recipe inputs at 15 per minute</title>
  <desc id="desc">An original diagram comparing standard, Electric Motor and Rigor Motor direct recipe inputs at equal output. Not a game screenshot.</desc>
  <rect width="1280" height="720" rx="28" fill="#101f1b"/>
  <circle cx="1130" cy="55" r="250" fill="#173b32" opacity=".52"/>
  <text x="64" y="78" fill="#c7df9b" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SATISFACTORY 1.1.x · RECIPE COMPARISON</text>
  <text x="64" y="151" fill="#fff" font-family="Inter, Noto Sans, sans-serif" font-size="48" font-weight="800">Three recipes. One target.</text>
  <rect x="1044" y="86" width="172" height="72" rx="18" fill="#d5ec9b"/>
  <text x="1130" y="116" fill="#1b342b" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="15" font-weight="700">SHARED OUTPUT</text>
  <text x="1130" y="144" fill="#1b342b" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" font-weight="800">15 Motors/min</text>
  <g font-family="Inter, Noto Sans, sans-serif">
    <rect x="64" y="197" width="360" height="400" rx="24" fill="#1b302a" stroke="#34534a" stroke-width="2"/><rect x="64" y="197" width="360" height="12" rx="6" fill="#d5ec9b"/>
    <text x="92" y="254" fill="#d5ec9b" font-size="16" font-weight="700" letter-spacing="2">STANDARD</text><text x="92" y="299" fill="#fff" font-size="30" font-weight="800">Motor</text>
    <rect x="92" y="325" width="304" height="54" rx="12" fill="#263e36"/><text x="244" y="360" fill="#e9f2e9" text-anchor="middle" font-size="19" font-weight="700">3 Assemblers</text>
    <text x="92" y="426" fill="#a9beb3" font-size="17" font-weight="600">DIRECT INPUTS / MIN</text>
    <rect x="92" y="445" width="140" height="90" rx="14" fill="#243f37"/><rect x="244" y="445" width="152" height="90" rx="14" fill="#243f37"/>
    <text x="162" y="480" fill="#c7df9b" text-anchor="middle" font-size="17" font-weight="700">Rotors</text><text x="162" y="516" fill="#fff" text-anchor="middle" font-size="27" font-weight="800">30</text>
    <text x="320" y="480" fill="#c7df9b" text-anchor="middle" font-size="17" font-weight="700">Stators</text><text x="320" y="516" fill="#fff" text-anchor="middle" font-size="27" font-weight="800">30</text>
    <text x="244" y="572" fill="#b9c8c0" text-anchor="middle" font-size="15">Needs both component lines</text>
    <rect x="460" y="197" width="360" height="400" rx="24" fill="#1b302a" stroke="#34534a" stroke-width="2"/><rect x="460" y="197" width="360" height="12" rx="6" fill="#e6a75f"/>
    <text x="488" y="254" fill="#e6a75f" font-size="16" font-weight="700" letter-spacing="2">ELECTRIC</text><text x="488" y="299" fill="#fff" font-size="30" font-weight="800">Electric Motor</text>
    <rect x="488" y="325" width="304" height="54" rx="12" fill="#263e36"/><text x="640" y="360" fill="#e9f2e9" text-anchor="middle" font-size="19" font-weight="700">2 Assemblers</text>
    <text x="488" y="426" fill="#a9beb3" font-size="17" font-weight="600">DIRECT INPUTS / MIN</text>
    <rect x="488" y="445" width="140" height="90" rx="14" fill="#243f37"/><rect x="640" y="445" width="152" height="90" rx="14" fill="#243f37"/>
    <text x="558" y="480" fill="#c7df9b" text-anchor="middle" font-size="17" font-weight="700">Rotors</text><text x="558" y="516" fill="#fff" text-anchor="middle" font-size="27" font-weight="800">15</text>
    <text x="716" y="475" fill="#c7df9b" text-anchor="middle" font-size="13" font-weight="700">Control Rods</text><text x="716" y="516" fill="#fff" text-anchor="middle" font-size="27" font-weight="800">7.5</text>
    <text x="640" y="572" fill="#b9c8c0" text-anchor="middle" font-size="15">Replaces Stators with Control Rods</text>
    <rect x="856" y="197" width="360" height="400" rx="24" fill="#1b302a" stroke="#34534a" stroke-width="2"/><rect x="856" y="197" width="360" height="12" rx="6" fill="#8cc6bb"/>
    <text x="884" y="254" fill="#8cc6bb" font-size="16" font-weight="700" letter-spacing="2">RIGOR</text><text x="884" y="299" fill="#fff" font-size="30" font-weight="800">Rigor Motor</text>
    <rect x="884" y="325" width="304" height="54" rx="12" fill="#263e36"/><text x="1036" y="360" fill="#e9f2e9" text-anchor="middle" font-size="19" font-weight="700">2 Manufacturers</text>
    <text x="884" y="426" fill="#a9beb3" font-size="17" font-weight="600">DIRECT INPUTS / MIN</text>
    <rect x="884" y="445" width="94" height="90" rx="14" fill="#243f37"/><rect x="989" y="445" width="94" height="90" rx="14" fill="#243f37"/><rect x="1094" y="445" width="94" height="90" rx="14" fill="#243f37"/>
    <text x="931" y="476" fill="#c7df9b" text-anchor="middle" font-size="14" font-weight="700">Rotors</text><text x="931" y="516" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">7.5</text>
    <text x="1036" y="476" fill="#c7df9b" text-anchor="middle" font-size="14" font-weight="700">Stators</text><text x="1036" y="516" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">7.5</text>
    <text x="1141" y="470" fill="#c7df9b" text-anchor="middle" font-size="11" font-weight="700">Oscillators</text><text x="1141" y="516" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">2.5</text>
    <text x="1036" y="572" fill="#b9c8c0" text-anchor="middle" font-size="15">Adds an upstream crystal chain</text>
  </g>
  <text x="64" y="656" fill="#d0d9d2" font-family="Inter, Noto Sans, sans-serif" font-size="17" font-weight="600">Nominal recipe inputs scaled to 15/min. Ore, upstream production, power and downtime are excluded.</text>
  <text x="1216" y="686" fill="#91a79b" text-anchor="end" font-family="Inter, Noto Sans, sans-serif" font-size="13">Original diagram · Not a game screenshot</text>
</svg>
