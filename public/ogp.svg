<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    OGP 画像（1200×630）の原本。配信するのは同じ絵を書き出した ogp.png のほう
    （SNS のクローラは SVG を読まないため）。文字を直したらこの SVG を直して
    `rsvg-convert public/ogp.svg -o public/ogp.png` で書き出し直す。
  -->
  <rect width="1200" height="630" fill="#101318"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="#171b22" stroke="#2b323d" stroke-width="2"/>

  <g transform="translate(96 150) scale(3.2)" >
    <g fill="#f0a13c">
      <g>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2"/>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(60 16 16)"/>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(120 16 16)"/>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(180 16 16)"/>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(240 16 16)"/>
        <rect x="13.5" y="2.6" width="5" height="6" rx="1.2" transform="rotate(300 16 16)"/>
      </g>
      <circle cx="16" cy="16" r="10"/>
    </g>
    <circle cx="16" cy="16" r="4.2" fill="#171b22"/>
  </g>

  <text x="230" y="222" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="40" font-weight="600" fill="#f0a13c" letter-spacing="2">SATISFACTORY</text>
  <text x="96" y="330" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="76" font-weight="700" fill="#ffffff">生産計画ツール</text>
  <text x="96" y="410" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="34" fill="#dde3ec">目標レートを入れるだけで、最適な生産ラインを日本語で計算する</text>

  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="28" fill="#93a1b3">
    <text x="96" y="500">代替レシピ・クロック・Somersloop 対応</text>
    <text x="96" y="546">Excel出力 ・ フローチャート ・ 共有URL</text>
  </g>
</svg>
