<text x="495" y="407" font-size="21" font-weight="700">容器入り希釈燃料</text><text x="495" y="447" font-size="18">廃重油60 m³/min</text><text x="495" y="479" font-size="18">＋包装済み水120個/min</text><text x="495" y="503" font-size="16" fill="#9cebd0">→ 包装済み燃料120個/min</text>
