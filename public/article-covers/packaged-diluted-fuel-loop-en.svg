<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Editorial diagram of the packaged diluted fuel balance and empty canister loop">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b2c"/><stop offset="1" stop-color="#17635c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#76e1ba"/></marker></defs>
<rect width="1280" height="720" fill="url(#bg)"/><path d="M0 618H1280" stroke="#4ed3a2" stroke-opacity=".35" stroke-width="2"/>
<g fill="#eef8f1" font-family="system-ui,sans-serif"><text x="58" y="78" font-size="42" font-weight="700">Packaged Diluted Fuel: inputs and return loop</text><text x="58" y="123" font-size="24" fill="#9cebd0">Steady-rate example from the Planner’s bundled Satisfactory 1.1.x recipes</text></g>
<g fill="#102b2c" stroke="#76e1ba" stroke-width="3"><rect x="58" y="174" width="1164" height="112" rx="18"/><rect x="58" y="365" width="250" height="148" rx="18"/><rect x="370" y="365" width="250" height="148" rx="18"/><rect x="682" y="365" width="250" height="148" rx="18"/><rect x="994" y="365" width="228" height="148" rx="18"/></g>
<g fill="none" stroke="#76e1ba" stroke-width="5" marker-end="url(#arrow)"><path d="M280 230h42"/><path d="M308 439h56"/><path d="M620 439h56"/><path d="M932 439h56"/><path d="M1108 516v70H183v-62"/></g>
<g fill="#eef8f1" font-family="system-ui,sans-serif" text-anchor="middle"><text x="640" y="216" font-size="26" font-weight="700">45 m³/min Crude Oil → 60 m³/min Heavy Oil Residue + 30 Resin/min</text><text x="640" y="257" font-size="20" fill="#b8d7cd">Refinery: Alternate: Heavy Oil Residue</text>
<text x="183" y="407" font-size="23" font-weight="700">Package Water</text><text x="183" y="447" font-size="18">120 m³/min Water</text><text x="183" y="479" font-size="18">+ 120 Empty Canisters/min</text><text x="183" y="503" font-size="16" fill="#9cebd0">→ 120 Packaged Water/min</text>
<text x="495" y="407" font-size="21" font-weight="700">Diluted Packaged Fuel</text><text x="495" y="447" font-size="18">60 m³/min Heavy Oil Residue</text><text x="495" y="479" font-size="18">+ 120 Packaged Water/min</text><text x="495" y="503" font-size="16" fill="#9cebd0">→ 120 packaged Fuel items/min</text>
<text x="807" y="407" font-size="23" font-weight="700">Unpackage Fuel</text><text x="807" y="447" font-size="18">120 packaged Fuel items/min</text><text x="807" y="479" font-size="18">→ 120 m³/min liquid Fuel</text><text x="807" y="503" font-size="16" fill="#9cebd0">+ 120 Empty Canisters/min</text>
<text x="1108" y="426" font-size="21" font-weight="700">Return empties</text><text x="1108" y="466" font-size="18">to Water Packagers</text><text x="1108" y="497" font-size="16" fill="#9cebd0">steady balance: 0/min net</text>
<text x="58" y="670" font-size="19" fill="#b8d7cd" text-anchor="start">Editorial diagram, not a game screen or measured result. Startup stock and in-game belt/pipe behavior need separate checks.</text></g></svg>
